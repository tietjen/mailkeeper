name: Release

# Two ways in:
#   · push a tag v<x.y.z>  → builds, signs, notarises and publishes the release
#   · "Run workflow"       → the same build, but never a release (a probe). On a tag ref too:
#                            publishing is tied to the event, not to the ref.
#
# Secrets (none of them in the repo):
#   APPLE_ID · APPLE_APP_PASSWORD · APPLE_TEAM_ID      notarisation
#   MACOS_CERTIFICATE_P12 · MACOS_CERTIFICATE_PASSWORD  Developer ID, base64 of the .p12
#   SPARKLE_ED_PRIVATE_KEY                              signs the update
# Without them the gate job stops with a clear message instead of producing something
# half-signed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  gate:
    # Only on the GitHub mirror. Gitea runs .github/workflows as well, has none of the Apple
    # secrets, and its gate failed on every tag — main turned red after each release. There
    # the runner skips the gate before any step runs, and build (needs: gate) with it.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      publishable: ${{ steps.licence.outputs.publishable }}
    steps:
      - uses: actions/checkout@v4

      # ADR-0013 §5: licence AND terms, asked positively — before the 30-minute build, not
      # after it.
      - id: licence
        run: |
          if [ -f LICENSE ] && [ -f TERMS.md ] && grep -q "^SPDX-License-Identifier:" LICENSE; then
            echo "publishable=yes" >> "$GITHUB_OUTPUT"
          else
            echo "publishable=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Lizenzsperre aktiv (ADR-0013): es wird nichts veröffentlicht und kein Paket abgelegt."
          fi

      - id: check
        env:
          HAVE: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAVE" = "true" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # A tag push means a release was wanted. Missing secrets must be red, not a
            # green run that quietly produced nothing.
            echo "::error::Tag gepusht, aber es fehlen Secrets (APPLE_ID, APPLE_APP_PASSWORD, APPLE_TEAM_ID, MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD, SPARKLE_ED_PRIVATE_KEY)."
            exit 1
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Probelauf übersprungen — es fehlen Secrets."
          fi

  build:
    needs: gate
    if: needs.gate.outputs.ready == 'yes'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write          # only the publish step needs it
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # release.sh counts commits for CFBundleVersion

      - name: Xcode auswählen
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Version bestimmen
        id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(cat VERSION)
          if [ "$REF_TYPE" = "tag" ]; then
            [ "v$VERSION" = "$REF_NAME" ] || { echo "::error::VERSION ist $VERSION, der Tag $REF_NAME"; exit 1; }
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # A keychain of its own, deleted again at the end — the runner is shared.
      # The step checks that the .p12 holds the identity release.sh signs with. Without that
      # check a wrong certificate (an "Apple Development" one, 2026-11-06) only shows up
      # eleven minutes later, when codesign finds no identity.
      - name: Signierschlüssel einrichten
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          IDENTITY=$(sed -n 's/^IDENTITY="\(.*\)"$/\1/p' Scripts/release.sh)
          [ -n "$IDENTITY" ] || { echo "::error::IDENTITY nicht in Scripts/release.sh gefunden"; exit 1; }
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          PASSWORD=$(uuidgen)
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
                          -T /usr/bin/codesign -T /usr/bin/security || {
            rm -f "$RUNNER_TEMP/cert.p12"
            echo "::error::Import der .p12 fehlgeschlagen. Bei „MAC verification failed“ passen MACOS_CERTIFICATE_P12 und MACOS_CERTIFICATE_PASSWORD nicht zusammen."
            exit 1
          }
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          FOUND=$(security find-identity -v -p codesigning "$KEYCHAIN")
          echo "$FOUND"
          if ! grep -qF "\"$IDENTITY\"" <<< "$FOUND"; then
            echo "::error::Die .p12 in MACOS_CERTIFICATE_P12 enthält nicht „$IDENTITY“. Gebraucht wird das Developer-ID-Application-Zertifikat samt privatem Schlüssel."
            exit 1
          fi

      - name: Bauen, notarisieren, signieren
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: Scripts/release.sh "${{ steps.v.outputs.version }}"

      - name: Schlüsselbund entfernen
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain" || true

      # Artefacts of a public repository can be downloaded by any signed-in GitHub user, so
      # while the licence lock holds, a probe must not leave a usable package behind: only
      # the appcast and the checksums, which prove the run without being the program.
      # (No .app either — upload-artifact drops symlinks and would mangle its signature.)
      - name: Probe ablegen (ohne Programm)
        if: github.event_name == 'workflow_dispatch' && needs.gate.outputs.publishable != 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: mailkeeper-probe-belege
          path: |
            build/release/${{ steps.v.outputs.version }}/appcast.xml
            build/release/${{ steps.v.outputs.version }}/SHA256SUMS
          retention-days: 7

      - name: Probe ablegen
        if: github.event_name == 'workflow_dispatch' && needs.gate.outputs.publishable == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: mailkeeper-probe
          path: |
            build/release/${{ steps.v.outputs.version }}/MailKeeper-${{ steps.v.outputs.version }}.dmg
            build/release/${{ steps.v.outputs.version }}/appcast.xml
            build/release/${{ steps.v.outputs.version }}/SHA256SUMS
          retention-days: 7

      # Publishing happens only on a pushed tag — a manual run on a tag ref must not turn
      # into a release — and only when the licence lock is open (ADR-0013). release.sh has
      # the same lock; this is the one that stops it before the upload.
      - name: Release veröffentlichen
        if: github.event_name == 'push' && github.ref_type == 'tag' && needs.gate.outputs.publishable == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          NOTES=$(awk "/^## \[$VERSION\]/{f=1;next} /^## \[/{f=0} f" CHANGELOG.md)
          gh release create "$REF_NAME" --verify-tag --title "MailKeeper $VERSION" \
             --notes "$NOTES" \
             "build/release/$VERSION/MailKeeper-$VERSION.dmg" \
             "build/release/$VERSION/appcast.xml" \
             "build/release/$VERSION/SHA256SUMS"
